# workflow/github-projects
#
# From shared-prompts/skills/github-projects/: about-github-projects (with its
# five reference pages) plus create-issue, pick-issue and techdebt.
#
# The board, field and option identifiers are opaque GraphQL node IDs. They are
# discovered once with `gh project view --format json` and `gh project
# field-list`, so every one of them is answered rather than guessed; none has a
# default.
formatVersion: 1

namespace: workflow
name: github-projects
version: 1.0.0

description: >-
  The GitHub Issues and Projects v2 workflow: how issues are written, picked up,
  moved across a board's Status column, and closed, with action skills for
  creating an issue, picking one to work on, and filing tech debt.

# The sub-agent delegation recipe is a build dependency, not a co-subscription:
# it becomes addressable from this recipe's own files, and its memory file lands
# in a project only when that project subscribes to it directly. The skills below
# therefore name the pattern rather than pointing at a file path.
depends:
  - workflow/sub-agent-delegation@^1.0.0

contents:
  - kind: skills
    include:
      - skills/**/*

variables:
  - name: githubRepo
    type: string
    prompt: Which GitHub repository do this project's issues live in?
    description: >-
      Every issue this recipe's skills read, create or close belongs to one
      repository, and this setting names it as the owner and repository joined by
      a slash, exactly as the `gh` command line accepts it. There is no default,
      because no other project's repository would be a safe guess. The owner may
      be an organization or a personal account, and the repository does not have
      to be the one this project's code lives in.
    example: acme/widget-api
    required: true
    scope: shared
    validate:
      pattern: "^[A-Za-z0-9._-]+/[A-Za-z0-9._-]+$"

  - name: githubProjectOwner
    type: string
    prompt: Which organization or user owns the Projects v2 board?
    description: >-
      Projects v2 boards hang off an organization or a personal account rather
      than off a repository, and this owner is what the `gh project` commands are
      given. There is no default. For an organization board this is the
      organization login; for a personal board it is your own GitHub login, which
      may differ from the owner half of the repository setting.
    example: acme
    required: true
    scope: shared
    validate:
      pattern: "^[A-Za-z0-9-]+$"

  - name: githubProjectNumber
    type: number
    prompt: What is the Projects v2 board's number?
    description: >-
      Each board carries a small number that identifies it to the `gh project`
      commands, and it is the last segment of the board's URL, so board
      https://github.com/orgs/acme/projects/1 is number 1. There is no default.
      Any positive whole number is acceptable; it is the board's number, not its
      position in any list you see.
    example: 1
    required: true
    scope: shared
    validate:
      min: 1

  - name: githubProjectId
    type: string
    prompt: What is the Projects v2 board's GraphQL node ID?
    description: >-
      Moving an issue between board columns goes through the GraphQL API, which
      addresses the board by an opaque node ID rather than by its number. Read it
      once with `gh project view <number> --owner <owner> --format json` and
      paste it here. There is no default, and the value is not something you can
      compose by hand; every board's ID begins with `PVT_`.
    example: PVT_kwDOABcDeF4AbCdE
    required: true
    scope: shared
    validate:
      pattern: "^PVT_[A-Za-z0-9_-]+$"

  - name: githubStatusFieldId
    type: string
    prompt: What is the node ID of the board's Status field?
    description: >-
      The workflow in this recipe moves work by setting one single-select field,
      Status, and the GraphQL API addresses that field by its own node ID. Read
      it with `gh project field-list <number> --owner <owner>`. There is no
      default. If your board renames the column field, this is still the field
      that holds the workflow states; every such ID begins with `PVTSSF_`.
    example: PVTSSF_lADOABcDeF4AbCdEzgWxYz12
    required: true
    scope: shared
    validate:
      pattern: "^PVTSSF_[A-Za-z0-9_-]+$"

  - name: githubStatusBacklogId
    type: string
    prompt: What is the option ID of the Status value "Backlog"?
    description: >-
      Each value of the Status field has its own option ID, and this one names
      the column where unstarted work waits. Read it with `gh project field-list
      <number> --owner <owner>`, which lists every option alongside its ID. There
      is no default. An option ID is eight hexadecimal characters, and it is tied
      to the column's identity rather than to its label, so it survives a rename.
    example: f75ad846
    required: true
    scope: shared
    validate:
      pattern: "^[0-9a-f]{8}$"

  - name: githubStatusReadyId
    type: string
    prompt: What is the option ID of the Status value "Ready"?
    description: >-
      The option ID of the column holding work that is specified and ready to be
      picked up; agents move an issue here once it is well enough described to
      start. Read it with `gh project field-list <number> --owner <owner>`. There
      is no default, and the value is eight hexadecimal characters. Point it at
      whichever of your columns plays this part if yours carries another name.
    example: 61e4505c
    required: true
    scope: shared
    validate:
      pattern: "^[0-9a-f]{8}$"

  - name: githubStatusInProgressId
    type: string
    prompt: What is the option ID of the Status value "In Progress"?
    description: >-
      The option ID of the column an issue moves to when work on it actually
      begins. Read it with `gh project field-list <number> --owner <owner>`.
      There is no default, and the value is eight hexadecimal characters. Point
      it at whichever of your columns means active work if yours carries another
      name.
    example: 47fc9ee4
    required: true
    scope: shared
    validate:
      pattern: "^[0-9a-f]{8}$"

  - name: githubStatusInReviewId
    type: string
    prompt: What is the option ID of the Status value "In Review"?
    description: >-
      The option ID of the column an issue moves to once its change is open for
      review and the work is out of the author's hands. Read it with `gh project
      field-list <number> --owner <owner>`. There is no default, and the value is
      eight hexadecimal characters. Boards without a review column can point this
      at the column that best matches, and the workflow still reads correctly.
    example: df73e18b
    required: true
    scope: shared
    validate:
      pattern: "^[0-9a-f]{8}$"

  - name: githubStatusDoneId
    type: string
    prompt: What is the option ID of the Status value "Done"?
    description: >-
      The option ID of the column that finished work lands in, which is where an
      issue goes as it is closed. Read it with `gh project field-list <number>
      --owner <owner>`. There is no default, and the value is eight hexadecimal
      characters. Point it at whichever column your board treats as the end of
      the line.
    example: "98236657"
    required: true
    scope: shared
    validate:
      pattern: "^[0-9a-f]{8}$"

  - name: githubUserLogin
    type: string
    prompt: What is your GitHub login?
    description: >-
      Agents use this to assign issues to you and to filter the board down to
      your own work, so it is your login rather than anything about the project.
      There is no default, since no answer would be right for a second person on
      the team; for the same reason the answer is kept in the gitignored local
      env file, and each teammate answers it for themselves.
    example: octocat
    required: true
    scope: local
    validate:
      pattern: "^[A-Za-z0-9-]+$"

  - name: userFullName
    type: string
    prompt: What is your full name, as it should appear in issue text?
    description: >-
      Your display name, written into the issues and board updates agents
      compose on your behalf, so that prose reads as though a person wrote it.
      There is no default. Any form you are happy to see in public issue text is
      acceptable; like the login above, it is personal, so it is kept in the
      gitignored local env file.
    example: Ada Lovelace
    required: true
    scope: local
    validate:
      minLength: 1

  - name: ticketPrefix
    env: SOUS_VAR_TICKET_PREFIX
    type: string
    prompt: What prefix goes in front of a ticket number when you compose a branch name?
    description: >-
      Agents join this prefix to a bare issue number to build a ticket ID, so
      issue 47 becomes gh-47 when the prefix is 'gh-'. Include any trailing
      separator, because nothing is inserted between the prefix and the number.
      The default suits GitHub issues, which is what this recipe tracks; any
      prefix is acceptable, and an empty answer means the bare number is used on
      its own. The task-files recipe asks the same question, so a single answer
      serves both.
    example: PROJ-
    default: gh-
    required: false
    scope: shared
