# workflow/task-files
#
# From shared-prompts/skills/task-files/, plus the two partials that only these
# skills include: _partials/resume-task.md and _partials/update-task-file.md.
# Those partials move INTO this recipe rather than becoming a shared dependency,
# because nothing outside this recipe includes them.
formatVersion: 1

namespace: workflow
name: task-files
version: 1.0.1

description: >-
  Per-branch task files: one working-notes file per git branch, with skills for
  starting a task, resuming one, updating it before a session ends, and carrying
  remaining work into a follow-up branch.

# The sub-agent delegation recipe is a build dependency, not a co-subscription:
# it becomes addressable from this recipe's own files, and its memory file lands
# in a project only when that project subscribes to it directly. The skills below
# therefore name the pattern rather than pointing at a file path.
depends:
  - workflow/sub-agent-delegation@^1.0.0

contents:
  - kind: skills
    include:
      - skills/**/*

variables:
  - name: taskFileRoot
    type: path
    prompt: Where should task files be stored?
    description: >-
      This recipe mandates the creation of task files that are stored locally
      and, in general, should not be committed. This setting dictates the path
      in which agents will store and search for your task files. The default
      value stores task files in the project's .sous directory, but you can
      specify any local path, either relative to the project root or absolute.
    example: .claude/tasks
    default: .sous/tasks
    required: true
    scope: shared
    validate:
      minLength: 1

  - name: ticketIdExample
    type: string
    prompt: What does one of your ticket IDs look like?
    description: >-
      The skills in this recipe quote a ticket ID in their trigger phrases and
      in the branch and file names they show as examples, and an ID in the shape
      your own tracker uses is what makes those examples recognisable. The
      default is a generic Jira-style placeholder that belongs to no real
      tracker, so replace it with whatever your team actually types, whether
      that is a Jira key, a GitHub issue reference, or something else entirely.
    example: gh-47
    default: PROJ-1234
    required: true
    scope: shared
    validate:
      minLength: 1

  - name: ticketPrefix
    env: SOUS_VAR_TICKET_PREFIX
    type: string
    prompt: What prefix goes in front of a ticket number when you compose a branch
      name?
    description: >-
      Agents join this prefix to a bare ticket number to build a full ticket ID,
      so ticket 1234 becomes PROJ-1234 when the prefix is 'PROJ-'. Include any
      trailing separator, because nothing is inserted between the prefix and the
      number. The default suits a Jira-style tracker; any prefix is acceptable,
      and an empty answer means the bare number is used on its own. The
      github-projects recipe asks the same question, so a single answer serves
      both.
    example: gh-
    default: PROJ-
    required: false
    scope: shared

  - name: featureBranchPrefix
    type: string
    prompt: What prefix should new feature branches start with?
    description: >-
      Agents prepend this to every branch name they create, which is how your
      branches stay grouped under your initials or your username. The default is
      empty, so a branch name begins with the ticket ID and nothing else. Any
      prefix is acceptable; include the trailing separator you want to see in
      the finished branch name.
    example: luke/
    default: ""
    required: false
    scope: local
