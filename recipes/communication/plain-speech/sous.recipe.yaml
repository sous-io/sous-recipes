# communication/plain-speech
#
# The plain-speech rules in three forms: a memory every session loads, a topic
# skill holding the full rules with models and a self-check, and a short partial
# (_partials/speak-plainly.md) that other recipes' commands include. Two action
# skills apply the rules on demand: one answers a question plainly, the other
# rewrites the previous reply plainly. No variables.
formatVersion: 1

namespace: communication
name: plain-speech
version: 1.0.0

description: >-
  Speaking plainly: the rules for writing a reader who was not there can
  understand, as a memory, a topic skill and a short partial other commands
  include, plus action skills to answer a question plainly and to rewrite the
  last reply plainly.

contents:
  - kind: skills
    include:
      - skills/**/*
  - kind: memories
    include:
      - memories/*.md
