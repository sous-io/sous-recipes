# communication/plain-speech
#
# The plain-speech rules in three forms: a memory every session loads, a topic
# skill holding the full rules with models and a self-check, and a short partial
# (_partials/speak-plainly.tpl.md) that other recipes' commands include. Three
# commands apply the rules on demand: /q answers a question plainly, and
# /speak-plainly and /wtf say the agent's last message again, plainly. The two
# share one body (_partials/say-it-plainly.tpl.md) and differ only in their
# description. No variables.
formatVersion: 1

namespace: communication
name: plain-speech
version: 1.0.0

description: >-
  Speaking plainly: the rules for writing a reader who was not there can
  understand, as a memory, a topic skill and a short partial other commands
  include, plus the commands /q (answer a question plainly) and
  /speak-plainly and /wtf (say the last message again, plainly).

contents:
  - kind: skills
    include:
      - skills/**/*
  - kind: memories
    include:
      - memories/*.md
