# communication/agent-conduct
#
# Always-loaded conduct rules for an agent working with a person, as six
# memories: agent conduct (a question is not an instruction, the whole problem
# is in scope, durable memories live in tracked sources), interaction style,
# quoting sources, respecting the user's time (research before asking, no
# hangers, links, numbered points, one report), drafting (a requested draft is
# shown in chat and never sent on its own), and outward actions (this
# project's setting for each kind of action other people can see). Four
# partials carry short reminders into the commands that need them: quote
# sources, the reply format, respect the user's time, and reporting back.
# Partials live in _partials/ and are never installed on their own. One
# command, /create-reply, drafts replies to other people's questions in the
# reply format. Nine variables: memoryRoot names where the project keeps its
# tracked memory fragments, and eight more say when the agent may take each
# kind of outward action without being asked.
formatVersion: 1

namespace: communication
name: agent-conduct
version: 1.0.0

description: >-
  Always-loaded conduct rules for an agent working with a person: a question is
  not an instruction, solve the whole problem, keep durable memories in tracked
  sources, quote a source's exact words behind every assertion based on what it
  said, respect the user's time (research before asking, no hangers, links,
  numbered points, one report), show a requested draft in chat instead of
  sending it, and take outward actions (pushes, pull requests, merges,
  releases, issues, comments, messages) only as far as this project's settings
  allow; plus partials for quoting, replying to questions, and reporting back,
  and the /create-reply command, which drafts replies that quote each question
  before answering it.

# The /create-reply command includes a partial from this recipe; it is a build
# dependency only, so its own memories and skills land in a project only when it
# subscribes to it directly.
depends:
  - communication/plain-speech@^1.0.0

contents:
  - kind: memories
    include:
      - memories/*.md
  - kind: skills
    include:
      - skills/**/*

variables:
  - name: memoryRoot
    env: MEMORY_ROOT
    type: path
    prompt: Where are this project's tracked memory fragments kept?
    description: >-
      Durable rules, preferences and project knowledge belong in a directory
      that is committed with the project, so they travel to every machine and
      every colleague instead of living in one machine's private memory store.
      This setting names that directory, and the conduct rules point agents at
      it. The default is the directory sous init creates for the fragments a
      build composes into the agent's instruction file. Any path works, either
      relative to the project root or absolute.
    example: .sous/prompts/memories
    default: .sous/memories
    required: true
    scope: shared
    validate:
      minLength: 1
  - name: pushOwnBranches
    type: enum
    prompt: When may the agent push a branch that nobody else works on?
    description: >-
      This setting governs pushing a branch that only the agent's own work uses to
      a shared remote, such as a feature branch created for the task. With the
      default, on-request, the agent commits locally and leaves the push for the
      user to approve, or pushes when the user asks for it in the moment. With
      autonomous-modes-only, the agent also does it on its own, but only while the
      user is away and has started autonomous work with /afk or /brb. With always,
      the agent does it on its own whenever the work calls for it. Anything the
      user approves up front, in /plan-auto or in the quick check that /afk and
      /brb run before the user leaves, is allowed whatever this setting says.
    example: autonomous-modes-only
    default: on-request
    required: true
    scope: shared
    validate:
      enum: [on-request, autonomous-modes-only, always]
  - name: openDraftPullRequests
    type: enum
    prompt: When may the agent open a draft pull request?
    description: >-
      This setting governs opening a draft pull request or merge request, which
      marks the change as not ready for review. With the default, on-request, the
      agent writes the title and description, shows them to the user and opens the
      draft only after the user approves, or opens it when the user asks for it in
      the moment. With autonomous-modes-only, the agent also does it on its own,
      but only while the user is away and has started autonomous work with /afk or
      /brb. With always, the agent does it on its own whenever the work calls for
      it. Anything the user approves up front, in /plan-auto or in the quick check
      that /afk and /brb run before the user leaves, is allowed whatever this
      setting says.
    example: autonomous-modes-only
    default: on-request
    required: true
    scope: shared
    validate:
      enum: [on-request, autonomous-modes-only, always]
  - name: openPullRequests
    type: enum
    prompt: When may the agent open a pull request that is ready for review?
    description: >-
      This setting governs opening a pull request or merge request that is ready
      for review, or marking a draft as ready, which usually notifies reviewers.
      With the default, on-request, the agent writes the title and description,
      shows them to the user and opens the pull request only after the user
      approves, or opens it when the user asks for it in the moment. With
      autonomous-modes-only, the agent also does it on its own, but only while the
      user is away and has started autonomous work with /afk or /brb. With always,
      the agent does it on its own whenever the work calls for it. Anything the
      user approves up front, in /plan-auto or in the quick check that /afk and
      /brb run before the user leaves, is allowed whatever this setting says.
    example: autonomous-modes-only
    default: on-request
    required: true
    scope: shared
    validate:
      enum: [on-request, autonomous-modes-only, always]
  - name: mergePullRequests
    type: enum
    prompt: When may the agent merge a pull request?
    description: >-
      This setting governs merging a pull request or merge request into its target
      branch. With the default, on-request, the agent never merges without the
      user's approval for that pull request, or merges when the user asks for it
      in the moment. With autonomous-modes-only, the agent also does it on its
      own, but only while the user is away and has started autonomous work with
      /afk or /brb. With always, the agent does it on its own whenever the work
      calls for it. Anything the user approves up front, in /plan-auto or in the
      quick check that /afk and /brb run before the user leaves, is allowed
      whatever this setting says.
    example: autonomous-modes-only
    default: on-request
    required: true
    scope: shared
    validate:
      enum: [on-request, autonomous-modes-only, always]
  - name: releaseOrPublish
    type: enum
    prompt: When may the agent release or publish?
    description: >-
      This setting governs anything that releases or publishes the project:
      cutting a release, pushing a release tag, publishing a package or deploying.
      With the default, on-request, the agent prepares the release and waits for
      the user's approval, or releases when the user asks for it in the moment.
      With autonomous-modes-only, the agent also does it on its own, but only
      while the user is away and has started autonomous work with /afk or /brb.
      With always, the agent does it on its own whenever the work calls for it.
      Anything the user approves up front, in /plan-auto or in the quick check
      that /afk and /brb run before the user leaves, is allowed whatever this
      setting says.
    example: autonomous-modes-only
    default: on-request
    required: true
    scope: shared
    validate:
      enum: [on-request, autonomous-modes-only, always]
  - name: createIssues
    type: enum
    prompt: When may the agent create an issue?
    description: >-
      This setting governs creating an issue, ticket or card in the project's
      tracker. With the default, on-request, the agent drafts the issue in chat
      and files it only after the user approves that draft, or files it when the
      user asks for it in the moment. With autonomous-modes-only, the agent also
      does it on its own, but only while the user is away and has started
      autonomous work with /afk or /brb. With always, the agent does it on its own
      whenever the work calls for it. Anything the user approves up front, in
      /plan-auto or in the quick check that /afk and /brb run before the user
      leaves, is allowed whatever this setting says.
    example: autonomous-modes-only
    default: on-request
    required: true
    scope: shared
    validate:
      enum: [on-request, autonomous-modes-only, always]
  - name: commentOnIssuesAndPullRequests
    type: enum
    prompt: When may the agent comment on an issue or pull request?
    description: >-
      This setting governs posting or editing a comment on an issue, a ticket, a
      pull request or a code review. With the default, on-request, the agent
      drafts the comment in chat and posts it only after the user approves that
      draft, or posts it when the user asks for it in the moment. With
      autonomous-modes-only, the agent also does it on its own, but only while the
      user is away and has started autonomous work with /afk or /brb. With always,
      the agent does it on its own whenever the work calls for it. Anything the
      user approves up front, in /plan-auto or in the quick check that /afk and
      /brb run before the user leaves, is allowed whatever this setting says.
    example: autonomous-modes-only
    default: on-request
    required: true
    scope: shared
    validate:
      enum: [on-request, autonomous-modes-only, always]
  - name: sendMessages
    type: enum
    prompt: When may the agent send a chat or email message?
    description: >-
      This setting governs sending a chat message or an email, or posting in a
      chat channel, to anyone. With the default, on-request, the agent drafts the
      message in chat and sends it only after the user approves that draft, or
      sends it when the user asks for it in the moment. With
      autonomous-modes-only, the agent also does it on its own, but only while the
      user is away and has started autonomous work with /afk or /brb. With always,
      the agent does it on its own whenever the work calls for it. Anything the
      user approves up front, in /plan-auto or in the quick check that /afk and
      /brb run before the user leaves, is allowed whatever this setting says.
    example: autonomous-modes-only
    default: on-request
    required: true
    scope: shared
    validate:
      enum: [on-request, autonomous-modes-only, always]
