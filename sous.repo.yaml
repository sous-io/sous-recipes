# The official public sous recipe repository: github.com/sous-io/sous-recipes
#
# Namespaces are drawn from the canonical skill category list, plus `core`.
# Subscribers to THIS repository are expected to subscribe per recipe; `core`
# is the exception, auto-subscribed as a whole namespace with opt-out-only
# semantics. Namespace subscriptions remain a first-class feature for other
# repositories, where a namespace is a coherent collection. The `omakase`
# recipes are the one-step alternative: each is a preset set that subscribes a
# project to recipes and namespaces chosen for it.
formatVersion: 1

name: sous-recipes

description: >-
  The official sous recipe repository. It publishes the core skills that teach
  agents about sous itself, plus the workflow, communication and tool-usage
  recipes that sous develops and dogfoods.

contribute: https://github.com/sous-io/sous-recipes/blob/main/CONTRIBUTING.md

namespaces:
  core:
    description: >-
      Skills that teach an agent about sous itself: what sous manages, how its
      configuration works, how templates render, and how skills are written.
      Auto-subscribed in every project, with opt-out-only semantics.
  workflow:
    description: >-
      Task tracking, branch conventions and issue-board practice: the recipes
      that shape how a unit of work starts, is recorded, and finishes.
  communication:
    description: >-
      Generic interaction patterns between a person and an agent, and between an
      orchestrating agent and its sub-agents.
  tool-usage:
    description: >-
      Recipes that teach an agent to drive an external tool, together with the
      scripts and references that tool needs.
  cli:
    description: >-
      Skills for designing command-line interfaces that behave predictably,
      name things consistently and tell their users plainly what happened.
  reasoning:
    description: >-
      How an agent thinks through a problem: weighing evidence, self-checking,
      decomposition, and knowing when it is stuck.
  engineering:
    description: How to design software people enjoy using.
  omakase:
    description: >-
      Preset sets of recipes, chosen for you and subscribed together.

recipes:
  - recipes/core/sous-skills
  - recipes/communication/control-flow
  - recipes/communication/plain-speech
  - recipes/communication/agent-conduct
  - recipes/workflow/sub-agent-delegation
  - recipes/workflow/task-files
  - recipes/workflow/autonomous-work
  - recipes/workflow/github-projects
  - recipes/workflow/sources-of-truth
  - recipes/workflow/agent-memory
  - recipes/tool-usage/automated-browser-tasks
  - recipes/cli/command-design
  - recipes/reasoning/evidence-and-verification
  - recipes/engineering/design-tenets
  - recipes/omakase/house
